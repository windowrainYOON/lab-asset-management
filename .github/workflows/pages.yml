# Publishes the mobile web app screens (webapp/web) to GitHub Pages.
# One-time: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Web app (Pages)
on:
  push:
    branches: [main]
    paths: ['webapp/web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/web
      - id: deployment
        uses: actions/deploy-pages@v4
